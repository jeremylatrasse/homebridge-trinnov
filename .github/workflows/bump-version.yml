name: Auto Tag Version on Push

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  tag-version:
    # Skip if the push already came from a release bot commit
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create or update version tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          VERSION=$(node -p "require('./package.json').version")
          echo "Tagging HEAD as v${VERSION}..."
          git tag -f "v${VERSION}"
          git push origin -f "refs/tags/v${VERSION}"
